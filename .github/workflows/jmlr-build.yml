name: jmlr-build

on:
  push:
    branches: [main]
    paths:
      - "paper/jmlr/**"
      - "paper/references.bib"
      - "experiments/paper_figures.py"
      - "experiments/build_anonymous_bundle.py"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/jmlr-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/jmlr/**"
      - "paper/references.bib"
      - "experiments/paper_figures.py"
      - "experiments/build_anonymous_bundle.py"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/jmlr-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jmlr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,optimization]'

      - name: Run exact regression suite
        run: pytest -q

      - name: Build and retest reviewer code bundle
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/reviewer-code
          python experiments/build_anonymous_bundle.py --output dist/reviewer_code.zip
          unzip -q dist/reviewer_code.zip -d /tmp/reviewer-code
          (
            cd /tmp/reviewer-code/submission_code
            python -m pip install -e .
            pytest -q
          )
          sha256sum dist/reviewer_code.zip > dist/reviewer_code_sha256.txt

      - name: Generate paper figures
        run: |
          rm -rf paper/jmlr/figures
          python experiments/paper_figures.py --outdir paper/jmlr/figures
          for f in \
            figure1_forward_equivalence.pdf \
            figure2_order_hierarchy.pdf \
            figure3_forward_class_census.pdf \
            figure4_order_to_time_geometry.pdf; do
            test -s "paper/jmlr/figures/${f}"
          done

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils \
            zip

      - name: Fetch pinned official JMLR style
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/JmlrOrg/jmlr-style-file/f413f638b407af76074813f8f88a82a7a5a81e9d/jmlr2e.sty \
            --output paper/jmlr/jmlr2e.sty
          test -s paper/jmlr/jmlr2e.sty
          sha256sum paper/jmlr/jmlr2e.sty > dist/jmlr_style_sha256.txt

      - name: Compile JMLR manuscript
        run: |
          set -euo pipefail
          cd paper/jmlr
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Enforce paper build quality
        run: |
          set -euo pipefail
          test -s paper/jmlr/main.pdf
          if grep -Eq "undefined references|Citation .* undefined|Reference .* undefined|There were undefined" paper/jmlr/main.log; then
            echo "Undefined citation/reference detected"
            exit 1
          fi
          if grep -q "Overfull \\hbox" paper/jmlr/main.log; then
            echo "Overfull box detected"
            grep "Overfull \\hbox" paper/jmlr/main.log
            exit 1
          fi
          pdf_bytes=$(stat -c%s paper/jmlr/main.pdf)
          if [ "${pdf_bytes}" -ge 5000000 ]; then
            echo "JMLR PDF exceeds 5 MB: ${pdf_bytes} bytes"
            exit 1
          fi
          pdfinfo paper/jmlr/main.pdf > dist/jmlr_pdfinfo.txt
          sha256sum paper/jmlr/main.pdf > dist/jmlr_pdf_sha256.txt
          grep "JMLR-MAIN-TEXT-LAST-PAGE" paper/jmlr/main.log | tail -1 > dist/jmlr_main_page.txt

      - name: Build and recompile source package
        run: |
          set -euo pipefail
          rm -rf dist/jmlr_source /tmp/jmlr-source-check
          mkdir -p dist/jmlr_source/paper/jmlr dist/jmlr_source/paper
          cp paper/jmlr/main.tex paper/jmlr/author_metadata.tex \
             paper/jmlr/reproducibility_statement.tex paper/jmlr/disclosures.tex \
             paper/jmlr/appendix.tex paper/jmlr/jmlr2e.sty dist/jmlr_source/paper/jmlr/
          cp paper/references.bib dist/jmlr_source/paper/references.bib
          cp -r paper/jmlr/sections dist/jmlr_source/paper/jmlr/sections
          cp -r paper/jmlr/figures dist/jmlr_source/paper/jmlr/figures
          (cd dist && zip -qr jmlr_source.zip jmlr_source)
          unzip -q dist/jmlr_source.zip -d /tmp/jmlr-source-check
          (
            cd /tmp/jmlr-source-check/jmlr_source/paper/jmlr
            pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
            bibtex main >/dev/null
            pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
            pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
            test -s main.pdf
          )
          sha256sum dist/jmlr_source.zip > dist/jmlr_source_sha256.txt

      - name: Build report
        run: |
          {
            echo "repository_commit=${GITHUB_SHA}"
            cat dist/jmlr_pdf_sha256.txt
            cat dist/jmlr_source_sha256.txt
            cat dist/reviewer_code_sha256.txt
            cat dist/jmlr_style_sha256.txt
            cat dist/jmlr_main_page.txt
            grep '^Pages:' dist/jmlr_pdfinfo.txt || true
          } > dist/jmlr_build_report.txt

      - name: Upload JMLR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmlr-submission-${{ github.sha }}
          retention-days: 30
          path: |
            paper/jmlr/main.pdf
            dist/jmlr_source.zip
            dist/reviewer_code.zip
            dist/jmlr_build_report.txt
            dist/jmlr_pdfinfo.txt
            dist/jmlr_pdf_sha256.txt
            dist/jmlr_source_sha256.txt
            dist/reviewer_code_sha256.txt
            dist/jmlr_style_sha256.txt
